name: Swift macOS CI & Guardrail Harness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Guardrail Harness (macOS 15 / Swift 6 / gopls)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 16 (Swift 6)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          swift --version

      - name: Setup Go toolchain & gopls
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Cache Swift Package Manager build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Run Unified Verification Harness (Static Guardrails + Debug + Fuzz/SLA Tests + Release)
        run: ./scripts/harness.sh
