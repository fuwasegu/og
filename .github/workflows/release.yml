name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # 手動実行(リリースは作らずビルド検証のみ)

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} (version=$tag_version) が VERSION ($project_version) と一致しません"
            exit 1
          fi
          echo "OK: tag=$tag_version matches VERSION=$project_version"

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          sw_vers
          swift --version

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Verification Harness
        run: ./scripts/harness.sh --quick

      - name: Build og.app (Release)
        run: bash scripts/build-app.sh "${{ steps.ver.outputs.version }}"

      - name: Sign (self-signed or ad-hoc)
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: bash scripts/sign-app.sh "build/og.app"

      - name: Package (zip, no xattr)
        run: |
          APP="build/og.app"
          ditto -c -k --keepParent --noextattr "$APP" og.app.zip
          shasum -a 256 og.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: og.app.zip
          path: og.app.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## インストール

          ```sh
          brew install --cask fuwasegu/tap/og
          ```

          または `og.app.zip` を展開して `/Applications` へ。要件: **macOS 14.0 (Sonoma)+**。

          > 未署名ビルドです。手動導入時の初回起動は **右クリック → 開く**、または `xattr -dr com.apple.quarantine /Applications/og.app`。Homebrew 版は自動で検疫属性を除去します。
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" og.app.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "og $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" og.app.zip \
              --title "og $GITHUB_REF_NAME" --notes-file notes.md
          fi

  update-cask:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Guard (TAP_GITHUB_TOKEN が必要)
        id: guard
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN 未設定 → cask 自動更新をスキップ（手動で更新してください）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          name: og.app.zip

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          repository: fuwasegu/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Bump cask (version + sha256)
        if: steps.guard.outputs.skip == 'false'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 og.app.zip | awk '{print $1}')
          f=tap/Casks/og.rb
          if [ -f "$f" ]; then
            sed -i -E "s/version \"[^\"]+\"/version \"$v\"/" "$f"
            sed -i -E "s/sha256 \"[0-9a-f]+\"/sha256 \"$sha\"/" "$f"
          else
            cat > "$f" <<EOF
          cask "og" do
            version "$v"
            sha256 "$sha"

            url "https://github.com/fuwasegu/og/releases/download/v#{version}/og.app.zip"
            name "og"
            desc "120fps native macOS Go editor with CoreText, Tree-sitter, and PTY terminal"
            homepage "https://github.com/fuwasegu/og"

            depends_on macos: :sonoma

            app "og.app"

            # 未署名ビルドの Gatekeeper 回避。quarantine のみ剥がす。
            postflight do
              system_command "/usr/bin/xattr",
                             args:         ["-dr", "com.apple.quarantine", "#{appdir}/og.app"],
                             sudo:         false,
                             must_succeed: false
            end

            zap trash: "~/Library/Preferences/dev.fuwasegu.og.plist"
          end
          EOF
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/og.rb
          git commit -m "og $v"
          git push
